<!DOCTYPE html>
<html>
    <head>
        <title>WxH</title>
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
            <style>
                body{background-image:radial-gradient(blue,lightblue);
                background-repeat:no-repeat;
                background-size:cover;
                
                }
            </style>
    </head>

    <body class="vh-100 d-flex justify-content-center align-items-center">
        <div class="container bg-info-subtle p-3 text-center rounded-2" style="Width:80%; margin:30px;">
            <h1>Area of Squareish/rectangleish</h1>
            <label class="form-label">Length(cm):</label>
            <input type="number" id="num1" class="form-control mb-2">
            <label class="form-label">Width(cm):</label>
            <input type="number" id="num2" class="form-control mb-2">
            <button onclick="areaCalc()" class="btn btn-info">Calculate</button>
            <p id="result"></p>
            <button class="btn btn-info" onclick="conversion()">Convert to meters</button>
            <p id="resultm"></p>
        </div>
        <script>
            function areaCalc(){
  // Move the element selection inside the function so it gets the current input values
  let length = Number(document.getElementById("num1").value); 
  let width = Number(document.getElementById("num2").value); 
  
  let total = length * width; 
  let display = document.getElementById("result"); 
  
  display.innerHTML = "The area of shape is " + total + " cm^2";
} 

function conversion(){ 
  let length = Number(document.getElementById("num1").value); 
  let width = Number(document.getElementById("num2").value); 
  
  let total = length * width; 
  let metres = total / 10000; 
  
  let display = document.getElementById("resultm"); 
  display.innerHTML = "The area of shape is " + metres + " m^2"; 
}
        </script>
    </body>
</html>
